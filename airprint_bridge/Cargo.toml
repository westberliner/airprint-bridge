[package]
name = "airprint-bridge"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
bytes = "1.12.1"
futures-util = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "client-legacy", "http1"] }
jpeg-encoder = "0.7.1"
mdns-sd = "0.21.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "net", "macros", "signal", "time", "io-util"] }
zune-jpeg = "0.5.15"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
