# Builds the add-on image per architecture and pushes it to GHCR, so Home Assistant
# downloads a ready image instead of compiling Rust on the Pi.
# After the first run, make the packages public and uncomment `image:` in config.yaml.
name: Build add-on images

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "version=$(sed -n 's/^version: *"\(.*\)"/\1/p' airprint_bridge/config.yaml)" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: airprint_bridge
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/airprint-bridge-${{ matrix.arch }}:${{ steps.meta.outputs.version }}
